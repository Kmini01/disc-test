<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-scale=1.0">
    <title>상황별 DISC 행동유형 검사 (30문항)</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        h1 {
            text-align: center;
            color: #0f172a;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 40px;
            font-size: 1.05rem;
        }

        .question-card {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 24px;
            transition: all 0.2s ease;
        }

        .question-title {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 16px;
            color: #1e293b;
        }

        .options-stack {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-label {
            display: flex;
            align-items: flex-start;
            padding: 14px 16px;
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95rem;
        }

        .option-label:hover {
            background: #eff6ff;
            border-color: #bfdbfe;
        }

        .option-label input {
            margin-top: 3px;
            margin-right: 12px;
            accent-color: var(--primary-color);
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        .btn-container {
            text-align: center;
            margin-top: 40px;
        }

        .submit-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 16px 48px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        .submit-btn:hover {
            background-color: var(--primary-hover);
        }

        #result-section {
            display: none;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-box {
            background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
            border: 1px solid #bfdbfe;
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            margin-bottom: 30px;
        }

        .result-title {
            font-size: 1.3rem;
            color: #1e40af;
            margin-bottom: 10px;
        }

        .result-highlight {
            font-size: 2.2rem;
            font-weight: 800;
            color: #1e3a8a;
            margin: 15px 0;
        }

        .score-details {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        @media (max-width: 600px) {
            .score-details {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .score-card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .score-card .type {
            font-weight: bold;
            font-size: 1.2rem;
            color: #2563eb;
        }

        .score-card .score {
            font-size: 1.1rem;
            color: #64748b;
            margin-top: 5px;
        }

        .description-box {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            margin-top: 20px;
            text-align: left;
        }

        .description-box h3 {
            color: #0f172a;
            margin-top: 0;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 10px;
        }

        .restart-btn {
            display: block;
            width: 100%;
            max-width: 250px;
            margin: 30px auto 0;
            background-color: #64748b;
            color: white;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .restart-btn:hover {
            background-color: #475569;
        }

        .error-msg {
            color: #ef4444;
            text-align: center;
            margin-top: 15px;
            font-weight: 600;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="test-section">
        <h1>상황별 DISC 행동유형 검사</h1>
        <p class="subtitle">각 상황에서 당신이 가장 취할 것 같은 행동을 선택해주세요. (총 30문항)</p>
        
        <form id="disc-form"></form>

        <div id="error-msg" class="error-msg">모든 문항(30문항)에 답변해주세요!</div>

        <div class="btn-container">
            <button type="button" class="submit-btn" onclick="calculateResult()">결과 확인하기</button>
        </div>
    </div>

    <div id="result-section">
        <h1>✨ 나의 DISC 행동유형 결과</h1>
        <p class="subtitle">상황별 반응을 분석한 성향 점수와 유형별 특징입니다.</p>

        <div class="result-box">
            <div class="result-title">가장 높게 나타난 나의 주 성향</div>
            <div class="result-highlight" id="primary-type-text">-</div>
            <div style="font-size: 1.05rem; color: #1d4ed8;" id="secondary-type-text">-</div>
            
            <div class="score-details">
                <div class="score-card">
                    <div class="type">D (주도형)</div>
                    <div class="score" id="score-D">0점</div>
                </div>
                <div class="score-card">
                    <div class="type">I (사교형)</div>
                    <div class="score" id="score-I">0점</div>
                </div>
                <div class="score-card">
                    <div class="type">S (안정형)</div>
                    <div class="score" id="score-S">0점</div>
                </div>
                <div class="score-card">
                    <div class="type">C (신중형)</div>
                    <div class="score" id="score-C">0점</div>
                </div>
            </div>
        </div>

        <div class="description-box" id="type-description"></div>

        <button type="button" class="restart-btn" onclick="resetTest()">다시 검사하기</button>
    </div>
</div>

<script>

        }

    function renderQuestions() {
        const formContainer = document.getElementById('disc-form');
        let html = '';

        situationalQuestions.forEach((q) => {
            html += `
                <div class="question-card">
                    <div class="question-title">Q${q.id}. ${q.situation}</div>
                    <div class="options-stack">
            `;
            // 문항별로 보기 순서 랜덤 섞기
            let shuffledOptions = [...q.options].sort(() => Math.random() - 0.5);

            shuffledOptions.forEach((opt) => {
                html += `
                    <label class="option-label">
                        <input type="radio" name="q${q.id}" value="${opt.type}">
                        <span>${opt.text}</span>
                    </label>
                `;
            });
            html += `
                    </div>
                </div>
            `;
        });
        formContainer.innerHTML = html;
    }

    function calculateResult() {
        let scores = { 'D': 0, 'I': 0, 'S': 0, 'C': 0 };
        let allAnswered = true;

        for (let i = 1; i <= situationalQuestions.length; i++) {
            const selected = document.querySelector(`input[name="q${i}"]:checked`);
            if (!selected) {
                allAnswered = false;
                break;
            }
            scores[selected.value]++;
        }

        const errorMsg = document.getElementById('error-msg');
        if (!allAnswered) {
            errorMsg.style.display = 'block';
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            return;
        }
        errorMsg.style.display = 'none';

        const sortedTypes = Object.entries(scores).sort((a, b) => b[1] - a[1]);
        const primary = sortedTypes[0];
        const secondary = sortedTypes[1];

        document.getElementById('score-D').innerText = scores['D'] + '점';
        document.getElementById('score-I').innerText = scores['I'] + '점';
        document.getElementById('score-S').innerText = scores['S'] + '점';
        document.getElementById('score-C').innerText = scores['C'] + '점';

        document.getElementById('primary-type-text').innerText = `1순위 유형: ${typeDescriptions[primary[0]].name} (${primary[1]}점)`;
        document.getElementById('secondary-type-text').innerText = `2순위 유형: ${typeDescriptions[secondary[0]].name} (${secondary[1]}점)`;

        const descHTML = `
            <h3>🔍 ${typeDescriptions[primary[0]].name} 상세 설명</h3>
            <p>${typeDescriptions[primary[0]].desc}</p>
            <br>
            <h3>💡 ${typeDescriptions[secondary[0]].name} 보조 성향 설명</h3>
            <p>${typeDescriptions[secondary[0]].desc}</p>
        `;
        document.getElementById('type-description').innerHTML = descHTML;

        document.getElementById('test-section').style.display = 'none';
        document.getElementById('result-section').style.display = 'block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetTest() {
        renderQuestions(); // 다시 검사 시 보기 순서가 새롭게 재배치됨
        document.getElementById('result-section').style.display = 'none';
        document.getElementById('test-section').style.display = 'block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
